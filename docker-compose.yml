version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database (Single Source of Truth)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-erp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erp_secure_password_123}
      POSTGRES_DB: ${DB_NAME:-erp_records_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp_user} -d ${DB_NAME:-erp_records_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Express Backend Instance 1 (Stateless)
  # ----------------------------------------------------------------------------
  api1:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.server
    container_name: erp_api_1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      INSTANCE_ID: api-instance-1
      DATABASE_URL: postgresql://${DB_USER:-erp_user}:${DB_PASSWORD:-erp_secure_password_123}@postgres:5432/${DB_NAME:-erp_records_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_signing_key_change_in_production_min_32_chars}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-client-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_ROLE: ${ADMIN_ROLE:-ADMIN}
      DEFAULT_CURRENCY: AED
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Express Backend Instance 2 (Stateless for Horizontal Scaling)
  # ----------------------------------------------------------------------------
  api2:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.server
    container_name: erp_api_2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      INSTANCE_ID: api-instance-2
      DATABASE_URL: postgresql://${DB_USER:-erp_user}:${DB_PASSWORD:-erp_secure_password_123}@postgres:5432/${DB_NAME:-erp_records_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_signing_key_change_in_production_min_32_chars}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-client-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_ROLE: ${ADMIN_ROLE:-ADMIN}
      DEFAULT_CURRENCY: AED
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Next.js 15 Frontend
  # ----------------------------------------------------------------------------
  client:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.client
    container_name: erp_client
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost/api
    ports:
      - "3000:3000"

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy & Load Balancer (least_conn)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: erp_nginx_lb
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - client

volumes:
  pgdata:
    driver: local
